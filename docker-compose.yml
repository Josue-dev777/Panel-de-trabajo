services:
  hosting-panel:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "4100-4999:4100-4999"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sites:/app/sites
      - ./logs:/app/logs
      - ./backups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - hosting-panel
    environment:
      UPSTREAM_HOST: hosting-panel
      UPSTREAM_PORT: "3000"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
